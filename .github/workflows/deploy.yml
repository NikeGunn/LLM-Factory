name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]  # Use 3.10 for better compatibility

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install CPU-only dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --no-cache-dir
        # Skip spaCy download in CI
        sed -i '/spacy download/d' scripts/setup_env.sh

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Test in Docker
      run: docker build -f Dockerfile.ci -t llm-factory-ci . && docker run llm-factory-ci